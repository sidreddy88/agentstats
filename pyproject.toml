[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentstats"
version = "0.2.0"
description = "Statistics for agent evals: from trajectories to claims you can defend (CIs chosen by how your eval set was built, pass^k, infra failures kept apart, judge checks)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Siddharth Sukumar" }]
keywords = ["llm", "agents", "evals", "statistics", "confidence-intervals", "llm-as-a-judge"]
dependencies = ["scipy>=1.11"]

[project.scripts]
agentstats = "agentstats.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15", "statsmodels>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
